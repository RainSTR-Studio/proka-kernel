[workspace]
members = ["arch/x86_64", ".", "common"]
resolver = "2"

[package]
name = "proka-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
anaxa-builder = "0.5.0"
glob = "0.3.0"

[workspace.dependencies]
# Self-dependencies
proka-common = { path = "common" }
proka-kernel-x86_64 = { path = "arch/x86_64" }

# 3rd-party dependencies
acpi = { git = "https://github.com/rust-osdev/acpi.git", branch = "main" }
hadris-fat = { version = "1.2.0", default-features = false, features = ["alloc", "lfn", "read", "sync"] }
log = "0.4.29"
num_enum = { version = "0.7.6", default-features = false }
pci_types = "0.10.1"
proka-bootloader = "0.5.4"
proka-exec = "0.6.1"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive", "serde_derive"] }
spin = { version = "0.12.2", features = ["ticket_mutex"] }
spinning_top = "0.3.0"
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
uart_16550 = "0.4.0"
x2apic = "0.5.0"
x86_64 = "0.15.5"

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "GPL-3.0"

[dependencies]
proka-common = { workspace = true }
proka-kernel-x86_64 = { workspace = true }
proka-bootloader = { workspace = true }
proka-exec = { workspace = true }
hadris-fat = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
spin = { workspace = true }
toml = { workspace = true }

[profile.release]
opt-level = 3
panic = "abort"
debug = false
codegen-units = 1
incremental = false

[features]
default = []
output_fb = ["proka-common/output_fb", "proka-kernel-x86_64/output_fb"]
output_serial = ["proka-common/output_serial", "proka-kernel-x86_64/output_serial"]
