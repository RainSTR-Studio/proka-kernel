[package]
name = "proka-kernel"
version = "0.1.0"
edition = "2024"

[build-dependencies]
anaxa-builder = "0.5.0"
glob = "0.3.0"

[dependencies]
acpi = "6.1.1"
axfatfs = { version = "0.1.0-pre.0", default-features = false, features = ["alloc", "lfn"] }
log = "0.4.29"
proka-bootloader = "0.5.0"
proka-exec = "0.3.0"
spin = "0.10.0"
spinning_top = "0.3.0"
talc = "5.0.3"
uart_16550 = "0.4.0"
x2apic = "0.5.0"
x86_64 = "0.15.4"

[profile.release]
opt-level = "z"
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
incremental = false
rpath = false
