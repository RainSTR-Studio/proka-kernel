[package]
name = "proka-kernel"
version = "0.2.3"
edition = "2024"

[build-dependencies]
anaxa-builder = "0.5.0"
glob = "0.3.0"

[dependencies]
acpi = { git = "https://github.com/rust-osdev/acpi.git", branch = "main" }
hadris-fat = { version = "1.2.0", default-features = false, features = ["alloc", "lfn", "read", "sync"] }
log = "0.4.29"
proka-bootloader = "0.5.4"
proka-exec = "0.4.2"
serde = { version = "1.0.228", default-features = false, features = ["alloc", "derive", "serde_derive"] }
spin = "0.10.0"
spinning_top = "0.3.0"
talc = "5.0.3"
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
uart_16550 = "0.4.0"
x2apic = "0.5.0"
x86_64 = "0.15.4"

[profile.release]
opt-level = 3
panic = "abort"
debug = false
debug-assertions = false
overflow-checks = false
codegen-units = 1
incremental = false
rpath = false
