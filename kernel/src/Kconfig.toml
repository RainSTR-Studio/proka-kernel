title = "Core"
desc = "Core Kernel Configuration"

[[config]]
name = "ENABLE_GRAPHICS"
type = "bool"
default = true
desc = "Enable Graphics Output"
help = "If enabled, the kernel will attempt to initialize the framebuffer and display graphics."

[[config]]
name = "ADDITIONAL_VERSION"
type = "string"
default = ""
desc = "Additional Version String"
help = "Additional version string to append to the kernel version."

[[config]]
name = "INITRD_PATH"
type = "cstr"
default = "/initrd.cpio"
desc = "Initrd Path"
help = "Path to the initrd file."
