title = "Kernel Configuration"

[[config]]
name = "LOG_LEVEL"
type = "choice"
default = "info"
desc = "Set kernel log level"
options = ["trace", "debug", "info", "warn", "error"]

[[config]]
name = "ENABLE_OUTPUT"
type = "bool"
default = true
desc = "Enables kernel-embedded output system (framebuffer)"
feature = ["output"]
